# CI/CD for omnimap-sync service
#
# Triggers:
#   - main branch -> deploy to DEV (namespace: omnimap)
#   - release/* branch -> deploy to PROD (namespace: omnimap-prod)

name: CI/CD Sync

on:
  push:
    branches:
      - main
      - 'release/*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: omnimap-registry.cr.cloud.ru/omnimap
  SERVICE_NAME: omnimap-sync
  DEPLOYMENT_NAME: omnimap-sync

jobs:
  build:
    name: Build
    runs-on: self-hosted
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      environment: ${{ steps.meta.outputs.environment }}
      namespace: ${{ steps.meta.outputs.namespace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate metadata
        id: meta
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          COMMIT=$(git rev-parse --short HEAD)

          if [[ "$BRANCH" == "main" ]]; then
            echo "tag=dev-${COMMIT}" >> $GITHUB_OUTPUT
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "namespace=omnimap" >> $GITHUB_OUTPUT
          elif [[ "$BRANCH" == release/* ]]; then
            VERSION="${BRANCH#release/}"
            echo "tag=${VERSION}-${COMMIT}" >> $GITHUB_OUTPUT
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "namespace=omnimap-prod" >> $GITHUB_OUTPUT
          fi

      - name: Login to Registry
        run: |
          echo "${{ secrets.CLOUDRU_REGISTRY_SK }}" | docker login omnimap-registry.cr.cloud.ru -u "${{ secrets.CLOUDRU_REGISTRY_AK }}" --password-stdin

      - name: Build and Push
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          docker build -t ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${TAG} .
          docker push ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${TAG}
          echo "Pushed ${{ env.SERVICE_NAME }}:${TAG}"

  deploy:
    name: Deploy to ${{ needs.build.outputs.environment }}
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    steps:
      - name: Verify kubeconfig
        run: kubectl get nodes

      - name: Setup ImagePullSecret
        run: |
          NAMESPACE="${{ needs.build.outputs.namespace }}"
          kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry omnimap-registry-secret \
            --namespace "${NAMESPACE}" \
            --docker-server=omnimap-registry.cr.cloud.ru \
            --docker-username="${{ secrets.CLOUDRU_REGISTRY_AK }}" \
            --docker-password="${{ secrets.CLOUDRU_REGISTRY_SK }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy service
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          NAMESPACE="${{ needs.build.outputs.namespace }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}:${TAG}"

          echo "Deploying ${{ env.SERVICE_NAME }} with tag ${TAG}"

          # Update deployment using kubectl set image (no Helm lock conflicts)
          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
            sync=${IMAGE} \
            -n "${NAMESPACE}"

          # Wait for rollout
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n "${NAMESPACE}" --timeout=5m

      - name: Show status
        if: always()
        run: |
          NAMESPACE="${{ needs.build.outputs.namespace }}"
          echo "=== Pods ==="
          kubectl get pods -n "${NAMESPACE}" -l app.kubernetes.io/name=${{ env.SERVICE_NAME }} || true
          echo ""
          echo "=== Deployment ==="
          kubectl get deployment -n "${NAMESPACE}" | grep -E "NAME|${{ env.DEPLOYMENT_NAME }}" || true
