# Mirror branches to GitHub
#
# Syncs all branches (main, feature/*, fix/*, bug/*) to GitHub mirror

name: Mirror to GitHub

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'bug/**'
      - 'release/**'

jobs:
  mirror:
    name: Mirror to GitHub
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitHub
        run: |
          # Configure git
          git config --local user.email "ci@gitverse.ru"
          git config --local user.name "GitVerse CI"

          # Add GitHub remote if not exists
          git remote add github git@github.com:PavelNikolaeW/omnimap-sync.git 2>/dev/null || true

          # Push current branch
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Mirroring branch: $BRANCH"
          git push github HEAD:$BRANCH --force
