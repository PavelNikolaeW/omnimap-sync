# Mirror branches to GitVerse
#
# Syncs all branches (main, feature/*, fix/*, bug/*) to GitVerse mirror

name: Mirror to GitVerse

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'bug/**'
      - 'release/**'

jobs:
  mirror:
    name: Mirror to GitVerse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitVerse
        env:
          GITVERSE_TOKEN: ${{ secrets.GITVERSE_TOKEN }}
        run: |
          # Configure git
          git config --local user.email "ci@github.com"
          git config --local user.name "GitHub CI"

          # Add GitVerse remote with token auth
          git remote add gitverse https://${GITVERSE_TOKEN}@gitverse.ru/PavelNikolaeW/omnimap-sync.git 2>/dev/null || true

          # Push current branch
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Mirroring branch: $BRANCH"
          git push gitverse HEAD:$BRANCH --force
